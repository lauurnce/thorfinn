<g class="txt" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="16" text-anchor="end">
<text x="569.9" y="118.0">Health and fitness. Thorkell loves a good fight and brings joy to the hard</text>
<text x="576.3" y="142.0">days. He reads the health log, counts sessions kept and nights slept,</text>
<text x="559.1" y="166.0">watches supplements and caffeine, and sets the week's plan with a grin.</text>
<text x="482.0" y="190.0">A coach, never a doctor. Runs Sunday.</text>
</g>
