<g class="txt" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="16" text-anchor="start">
<text x="264.4" y="118.0">Finances. Canute learned to run a kingdom as an economy. He reads</text>
<text x="270.9" y="142.0">the finance sheet without ever touching it, reports spending against</text>
<text x="266.6" y="166.0">budget, flags unusual expenses, and keeps any group funds separate</text>
<text x="262.3" y="190.0">from personal money. Runs on the 1st of each month.</text>
</g>
